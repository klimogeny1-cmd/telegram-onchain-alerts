# Offline demo settings - no Solami key, no Telegram, no network.
#
#   python3 main.py --env examples/offline-demo.conf \
#       --replay-file tests/fixtures/solami/blur_frames.jsonl --dry-run
#
# Replays SYNTHETIC Blur frames (hand-built from the documented event shapes, not a
# mainnet recording) through the real parser, rules, dedup and formatter, and prints the
# posts. RPC-backed facts (authorities, top holders) need a key, so they are skipped here.
DATA_SOURCE=solami
TAPE_MODE=watchlist
WATCH_MINTS=DemoTape111111111111111111111111111111111111
LOG_LEVEL=WARNING
